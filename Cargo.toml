[workspace]
    default-members=["."]
    members=[".", "crates/abi", "crates/android", "crates/audio", "crates/graphics-vulkan", "crates/jni-bridge", "crates/jnivm", "crates/linker", "crates/logging", "crates/native-sys"]
    resolver="3"

    [workspace.package]
        edition="2024"
        license="GPL-3.0-or-later"
        version="0.1.5"

    [workspace.dependencies]
        ash={version="0.38.0", default-features=false, features=["loaded", "std"]}
        cmake="0.1.58"
        cpal={version="0.18.2", default-features=false}
        jni-sys="0.4.1"
        jnivm={path="crates/jnivm"}
        libc="0.2.191"
        roblox-abi={path="crates/abi"}
        roblox-android={path="crates/android"}
        roblox-audio={path="crates/audio"}
        roblox-graphics-vulkan={path="crates/graphics-vulkan"}
        roblox-jni-bridge={path="crates/jni-bridge"}
        roblox-linker={path="crates/linker"}
        roblox-logging={path="crates/logging"}
        roblox-native-sys={path="crates/native-sys"}
        rustix={version="1", default-features=false, features=["mm", "param", "std"]}
        serde_json="1.0.154"
        ureq="3.5.2"
        zip={version="9.8.2", default-features=false, features=["deflate"]}

[package]
    description="Embeddable Roblox Android runtime for Linux"
    edition.workspace=true
    license.workspace=true
    name="roblox-runtime"
    version.workspace=true

[dependencies]
    jnivm.workspace=true
    roblox-abi.workspace=true
    roblox-android.workspace=true
    roblox-audio.workspace=true
    roblox-graphics-vulkan.workspace=true
    roblox-jni-bridge.workspace=true
    roblox-linker.workspace=true
    roblox-logging.workspace=true
    serde_json.workspace=true
    ureq.workspace=true

[lints.rust]
    unsafe_code="deny"
    unsafe_op_in_unsafe_fn="deny"

[lints.clippy]
    undocumented_unsafe_blocks="warn"

[profile.release]
    debug=true
