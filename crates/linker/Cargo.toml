[package]
    description="Experimental Rust ELF mapper and relocator for the Roblox runtime"
    edition.workspace=true
    license.workspace=true
    name="roblox-linker"
    version.workspace=true

[lints.rust]
    # Mapping executable ELF images and transferring control to their
    # constructors necessarily crosses an unsafe OS/process boundary.
    unsafe_code="allow"
    unsafe_op_in_unsafe_fn="deny"

[lints.clippy]
    undocumented_unsafe_blocks="warn"

[dependencies]
    libc.workspace=true
    roblox-logging.workspace=true
    rustix.workspace=true
