[package]
name = "roblox-linker"
description = "AOSP bionic linker compatibility bindings for Roblox runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
links = "cordial_linker_shim"
build = "build.rs"

[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "warn"

[build-dependencies]
cmake = "0.1"
