[package]
    build="build.rs"
    description="Android framework compatibility APIs for the Roblox runtime"
    edition.workspace=true
    license.workspace=true
    name="roblox-android"
    version.workspace=true

[dependencies]
    roblox-linker-sys={path="../linker-sys"}
    roblox-logging={path="../logging"}
    serde_json="1.0.154"
    zip={version="9.4.1", default-features=false, features=["deflate"]}

[lints.rust]
    unsafe_code="allow"
    unsafe_op_in_unsafe_fn="deny"

[lints.clippy]
    undocumented_unsafe_blocks="warn"
