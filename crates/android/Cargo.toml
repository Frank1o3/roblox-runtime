[package]
    build="build.rs"
    description="Android framework compatibility APIs for the Roblox runtime"
    edition.workspace=true
    license.workspace=true
    name="roblox-android"
    version.workspace=true

[dependencies]
roblox-logging = { path = "../logging" }
    roblox-linker={path="../linker"}
    serde_json="1.0.151"
    zip={version="8.6.0", default-features=false, features=["deflate"]}

[lints.rust]
    unsafe_code="allow"
    unsafe_op_in_unsafe_fn="deny"

[lints.clippy]
    undocumented_unsafe_blocks="warn"
