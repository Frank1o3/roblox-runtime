[package]
    build="build.rs"
    description="Android framework compatibility APIs for the Roblox runtime"
    edition.workspace=true
    license.workspace=true
    name="roblox-android"
    version.workspace=true

[dependencies]
    roblox-linker-sys.workspace=true
    roblox-logging.workspace=true
    serde_json.workspace=true
    zip.workspace=true

[lints.rust]
    unsafe_code="allow"
    unsafe_op_in_unsafe_fn="deny"

[lints.clippy]
    undocumented_unsafe_blocks="warn"
