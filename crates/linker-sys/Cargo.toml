[package]
    build="build.rs"
    description="AOSP bionic linker-sys compatibility bindings for Roblox runtime"
    edition.workspace=true
    license.workspace=true
    links="roblox_linker_sys_shim"
    name="roblox-linker-sys"
    version.workspace=true

[lints.rust]
    unsafe_code="allow"
    unsafe_op_in_unsafe_fn="deny"

[lints.clippy]
    undocumented_unsafe_blocks="warn"

[build-dependencies]
    cmake.workspace=true
