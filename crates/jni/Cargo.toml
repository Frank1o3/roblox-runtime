[package]
    build="build.rs"
    description="JNI/JVM compatibility API for the Roblox Android runtime"
    edition.workspace=true
    license.workspace=true
    name="roblox-jni"
    version.workspace=true

[dependencies]
    roblox-linker={path="../linker"}

[lints.rust]
    unsafe_code="allow"
    unsafe_op_in_unsafe_fn="deny"

[lints.clippy]
    undocumented_unsafe_blocks="warn"
